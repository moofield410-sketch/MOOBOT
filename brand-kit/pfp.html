<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1000px; height: 1000px; overflow: hidden; }
  .wrap { position: relative; width: 1000px; height: 1000px; overflow: hidden;
    background: linear-gradient(180deg, #bfe3f5 0%, #e3f1e6 55%, #f7f3e3 100%); }
  .sun { position: absolute; left: 230px; top: 90px; width: 540px; height: 540px; border-radius: 50%;
    background: radial-gradient(circle, rgb(255 216 77 / .9), rgb(255 228 140 / .45) 45%, transparent 70%); }
  .rays { position: absolute; left: 190px; top: 50px; width: 620px; height: 620px; border-radius: 50%;
    background: repeating-conic-gradient(rgb(242 183 5 / .35) 0deg 4deg, transparent 4deg 18deg);
    -webkit-mask: radial-gradient(circle, transparent 58%, black 59%, black 68%, transparent 69%); }
  .hill1 { position: absolute; left: -100px; right: -100px; bottom: -260px; height: 520px; border-radius: 50%; background: #5daa4a; }
  .hill2 { position: absolute; left: -300px; right: 300px; bottom: -330px; height: 520px; border-radius: 50%; background: #2f7a32; }
  img { position: absolute; left: 110px; top: 150px; width: 780px; height: 819px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sun"></div>
    <div class="rays"></div>
    <div class="hill1"></div>
    <div class="hill2"></div>
    <img src="../public/moobot-assets/moobot-agent.svg" alt="" />
  </div>
</body>
</html>
